<script>
/* =========================================================
   TRAVELORA - MY TRIPS JAVASCRIPT
   USER-WISE BOOKING INTEGRATION
   BOOKING + TRIP + ADMIN DASHBOARD SYNCHRONISATION

   Features:
   1. Displays bookings of the logged-in user only.
   2. Reads traveloraTrips and travelBookings.
   3. Supports different booking data field names.
   4. Automatically updates booking summaries.
   5. Supports destination-specific images.
   6. Supports search and filters.
   7. Synchronises cancellation with admin records.
   8. Allows deletion of completed trips from trip history.
   9. Refreshes when booking data changes.
========================================================= */


/* =========================================================
   STORAGE KEYS
========================================================= */

const TRAVELORA_MY_TRIPS_KEY = "traveloraTrips";
const TRAVELORA_MY_BOOKINGS_KEY = "travelBookings";


/* =========================================================
   CURRENT USER
========================================================= */

function traveloraGetCurrentUser() {

    return {

        loggedIn:
            localStorage.getItem("isLoggedIn") === "true",

        id:
            localStorage.getItem("userId") || "",

        name:
            localStorage.getItem("userName") || "",

        email:
            localStorage.getItem("userEmail") || "",

        phone:
            localStorage.getItem("userPhone") || ""

    };

}


/* =========================================================
   CHECK LOGIN
========================================================= */

function traveloraCheckTripsLogin() {

    const user = traveloraGetCurrentUser();

    if (!user.loggedIn) {

        alert("Please login to view your trips.");

        localStorage.setItem(
            "redirectAfterLogin",
            "trips.html"
        );

        window.location.replace("login.html");

        return false;

    }

    return true;

}


/* =========================================================
   GET ARRAY FROM LOCAL STORAGE
========================================================= */

function traveloraGetStoredArray(key) {

    try {

        const saved = JSON.parse(
            localStorage.getItem(key) || "[]"
        );

        return Array.isArray(saved) ? saved : [];

    } catch (error) {

        console.error(
            "Unable to read storage:",
            key,
            error
        );

        return [];

    }

}


/* =========================================================
   GET SAVED TRIPS
========================================================= */

function traveloraGetTrips() {

    return traveloraGetStoredArray(
        TRAVELORA_MY_TRIPS_KEY
    );

}


/* =========================================================
   GET MASTER BOOKINGS
========================================================= */

function traveloraGetMasterBookings() {

    return traveloraGetStoredArray(
        TRAVELORA_MY_BOOKINGS_KEY
    );

}


/* =========================================================
   SAVE TRIPS
========================================================= */

function traveloraSaveTrips(trips) {

    localStorage.setItem(
        TRAVELORA_MY_TRIPS_KEY,
        JSON.stringify(trips)
    );

    window.dispatchEvent(
        new Event("traveloraDataUpdated")
    );

}


/* =========================================================
   SAVE MASTER BOOKINGS
========================================================= */

function traveloraSaveMasterBookings(bookings) {

    localStorage.setItem(
        TRAVELORA_MY_BOOKINGS_KEY,
        JSON.stringify(bookings)
    );

    window.dispatchEvent(
        new Event("traveloraDataUpdated")
    );

}


/* =========================================================
   NORMALISE TEXT
========================================================= */

function traveloraNormaliseText(value) {

    return String(value ?? "")
        .trim()
        .toLowerCase();

}


/* =========================================================
   GET BOOKING ID
========================================================= */

function traveloraGetBookingId(trip) {

    return String(
        trip.id ??
        trip.bookingId ??
        trip.bookingID ??
        trip.referenceId ??
        trip.reference ??
        ""
    );

}


/* =========================================================
   GET OWNER DETAILS
========================================================= */

function traveloraGetOwnerDetails(record) {

    const userDetails =
        record.user ||
        record.userDetails ||
        record.customer ||
        {};

    return {

        id:
            record.userId ||
            record.customerId ||
            userDetails.id ||
            userDetails.userId ||
            "",

        email:
            record.userEmail ||
            record.email ||
            record.customerEmail ||
            userDetails.email ||
            "",

        phone:
            record.userPhone ||
            record.phone ||
            record.mobile ||
            record.contact ||
            userDetails.phone ||
            userDetails.mobile ||
            "",

        name:
            record.userName ||
            record.customerName ||
            record.name ||
            userDetails.name ||
            userDetails.fullName ||
            ""

    };

}


/* =========================================================
   CHECK WHETHER BOOKING BELONGS TO CURRENT USER

   A booking without owner information is not displayed
   because it cannot safely be assigned to the current user.
========================================================= */

function traveloraIsCurrentUsersTrip(trip) {

    const currentUser = traveloraGetCurrentUser();

    const owner = traveloraGetOwnerDetails(trip);

    const currentId =
        traveloraNormaliseText(currentUser.id);

    const currentEmail =
        traveloraNormaliseText(currentUser.email);

    const currentPhone =
        traveloraNormaliseText(currentUser.phone);

    const currentName =
        traveloraNormaliseText(currentUser.name);

    const ownerId =
        traveloraNormaliseText(owner.id);

    const ownerEmail =
        traveloraNormaliseText(owner.email);

    const ownerPhone =
        traveloraNormaliseText(owner.phone);

    const ownerName =
        traveloraNormaliseText(owner.name);


    if (currentId && ownerId) {

        return currentId === ownerId;

    }


    if (currentEmail && ownerEmail) {

        return currentEmail === ownerEmail;

    }


    if (currentPhone && ownerPhone) {

        return currentPhone === ownerPhone;

    }


    if (
        currentName &&
        ownerName &&
        !currentEmail &&
        !currentPhone &&
        !currentId
    ) {

        return currentName === ownerName;

    }


    return false;

}


/* =========================================================
   FIND RELATED MASTER BOOKING

   Some older trip records may not contain user information.
   We try to find their matching master booking.
========================================================= */

function traveloraFindMasterBooking(trip, bookings) {

    const tripId = traveloraGetBookingId(trip);

    if (!tripId) return null;

    return bookings.find(booking => {

        return (
            traveloraGetBookingId(booking) === tripId
        );

    }) || null;

}


/* =========================================================
   CHECK BOOKING OWNERSHIP USING MASTER RECORD
========================================================= */

function traveloraBelongsToCurrentUser(trip, bookings) {

    if (traveloraIsCurrentUsersTrip(trip)) {

        return true;

    }

    const relatedBooking =
        traveloraFindMasterBooking(trip, bookings);

    if (relatedBooking) {

        return traveloraIsCurrentUsersTrip(
            relatedBooking
        );

    }

    return false;

}


/* =========================================================
   GET DESTINATION
========================================================= */

function traveloraGetDestination(trip) {

    return (

        trip.destination ||
        trip.to ||
        trip.toLocation ||
        trip.hotelName ||
        trip.packageName ||
        trip.activityName ||
        trip.place ||
        trip.location ||
        trip.title ||
        trip.name ||
        "Your Destination"

    );

}


/* =========================================================
   GET SERVICE TYPE
========================================================= */

function traveloraGetService(trip) {

    return (

        trip.service ||
        trip.serviceType ||
        trip.bookingType ||
        trip.category ||
        trip.type ||
        "Travel"

    );

}


/* =========================================================
   GET TRAVEL DATE
========================================================= */

function traveloraGetTravelDate(trip) {

    return (

        trip.departureDate ||
        trip.travelDate ||
        trip.date ||
        trip.journeyDate ||
        trip.checkIn ||
        trip.checkInDate ||
        trip.bookingDate ||
        trip.startDate ||
        ""

    );

}


/* =========================================================
   GET TRAVELLER COUNT
========================================================= */

function traveloraGetTravellerCount(trip) {

    return (

        trip.travellers ||
        trip.travelers ||
        trip.passengers ||
        trip.guestCount ||
        trip.numberOfGuests ||
        trip.persons ||
        trip.quantity ||
        1

    );

}


/* =========================================================
   GET BOOKING PRICE
========================================================= */

function traveloraGetPrice(trip) {

    const amount =

        trip.finalPrice ??
        trip.totalAmount ??
        trip.totalPrice ??
        trip.amount ??
        trip.price ??
        trip.grandTotal ??
        trip.bookingAmount ??
        trip.payableAmount ??
        0;

    const parsed = Number(
        String(amount).replace(/[₹,\s]/g, "")
    );

    return Number.isFinite(parsed) ? parsed : 0;

}


/* =========================================================
   NORMALISE SERVICE NAME
========================================================= */

function traveloraNormaliseService(service) {

    const value = String(
        service || "Travel"
    ).toLowerCase();


    if (
        value.includes("flight") ||
        value.includes("airline") ||
        value.includes("air")
    ) {

        return "Flight";

    }


    if (
        value.includes("hotel") ||
        value.includes("stay") ||
        value.includes("resort") ||
        value.includes("room")
    ) {

        return "Hotel";

    }


    if (
        value.includes("train") ||
        value.includes("rail")
    ) {

        return "Train";

    }


    if (value.includes("bus")) {

        return "Bus";

    }


    if (
        value.includes("package") ||
        value.includes("tour")
    ) {

        return "Package";

    }


    if (
        value.includes("activity") ||
        value.includes("adventure")
    ) {

        return "Activity";

    }


    if (value.includes("cab")) {

        return "Cab";

    }


    return service || "Travel";

}


/* =========================================================
   NORMALISE BOOKING RECORD

   Converts different booking structures into a common format.
========================================================= */

function traveloraNormaliseBooking(record) {

    return {

        ...record,

        id: traveloraGetBookingId(record),

        destination:
            traveloraGetDestination(record),

        service:
            traveloraNormaliseService(
                traveloraGetService(record)
            ),

        departureDate:
            traveloraGetTravelDate(record),

        travellers:
            traveloraGetTravellerCount(record),

        finalPrice:
            traveloraGetPrice(record)

    };

}


/* =========================================================
   GET CURRENT USER'S BOOKINGS

   Reads both:
   traveloraTrips
   travelBookings

   Uses booking IDs to avoid duplicate cards.
========================================================= */

function traveloraGetCurrentUsersTrips() {

    const savedTrips =
        traveloraGetTrips();

    const masterBookings =
        traveloraGetMasterBookings();


    const userTrips = [];


    /* FIRST: READ THE TRIPS ARRAY */

    savedTrips.forEach(trip => {

        if (
            traveloraBelongsToCurrentUser(
                trip,
                masterBookings
            )
        ) {

            const relatedBooking =
                traveloraFindMasterBooking(
                    trip,
                    masterBookings
                );

            const mergedRecord = {

                ...(relatedBooking || {}),
                ...trip

            };

            userTrips.push(
                traveloraNormaliseBooking(
                    mergedRecord
                )
            );

        }

    });


    /* SECOND: INCLUDE BOOKINGS NOT PRESENT IN TRIPS */

    masterBookings.forEach(booking => {

        if (
            !traveloraIsCurrentUsersTrip(booking)
        ) {

            return;

        }


        const bookingId =
            traveloraGetBookingId(booking);


        const alreadyExists = userTrips.some(trip => {

            return (
                traveloraGetBookingId(trip) === bookingId
            );

        });


        if (!alreadyExists) {

            userTrips.push(
                traveloraNormaliseBooking(booking)
            );

        }

    });


    return userTrips;

}


/* =========================================================
   DATE HELPERS
========================================================= */

function traveloraGetDate(dateString) {

    if (!dateString) return null;


    const match = String(dateString).match(
        /^(\d{4})-(\d{2})-(\d{2})$/
    );


    if (match) {

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        const date = new Date(
            year,
            month - 1,
            day
        );


        if (
            date.getFullYear() !== year ||
            date.getMonth() !== month - 1 ||
            date.getDate() !== day
        ) {

            return null;

        }


        return date;

    }


    const parsed = new Date(dateString);


    if (Number.isNaN(parsed.getTime())) {

        return null;

    }


    return new Date(
        parsed.getFullYear(),
        parsed.getMonth(),
        parsed.getDate()
    );

}


/* =========================================================
   TODAY
========================================================= */

function traveloraToday() {

    const now = new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function traveloraFormatDate(dateString) {

    const date =
        traveloraGetDate(dateString);


    if (!date) {

        return dateString || "Not available";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================================
   TRIP STATUS
========================================================= */

function traveloraTripStatus(trip) {

    const savedStatus =
        String(trip.status || "").toLowerCase();


    if (
        savedStatus === "cancelled" ||
        savedStatus === "canceled"
    ) {

        return "Cancelled";

    }


    const departureDate =
        traveloraGetDate(
            traveloraGetTravelDate(trip)
        );


    if (!departureDate) {

        if (
            savedStatus === "completed" ||
            savedStatus === "complete"
        ) {

            return "Completed";

        }

        return "Confirmed";

    }


    const today =
        traveloraToday();


    if (departureDate < today) {

        return "Completed";

    }


    if (
        departureDate.getTime() === today.getTime()
    ) {

        return "Travel Today";

    }


    return "Confirmed";

}


/* =========================================================
   CANCELLATION RULE
========================================================= */

function traveloraCanCancel(trip) {

    if (
        String(trip.status || "").toLowerCase() === "cancelled" ||
        String(trip.status || "").toLowerCase() === "canceled"
    ) {

        return false;

    }


    const departureDate =
        traveloraGetDate(
            traveloraGetTravelDate(trip)
        );


    if (!departureDate) {

        return false;

    }


    const diffDays = Math.round(

        (
            departureDate -
            traveloraToday()
        ) / 86400000

    );


    return diffDays >= 1;

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function traveloraFormatPrice(amount) {

    const price = Number(amount);


    return "₹" + (

        Number.isFinite(price)
            ? price
            : 0

    ).toLocaleString(
        "en-IN",
        {
            maximumFractionDigits: 2
        }
    );

}


/* =========================================================
   SERVICE ICON
========================================================= */

function traveloraServiceIcon(service) {

    const normalised =
        traveloraNormaliseService(service);


    const icons = {

        Flight: "fa-plane",

        Hotel: "fa-hotel",

        Train: "fa-train",

        Bus: "fa-bus",

        Package: "fa-suitcase-rolling",

        Activity: "fa-person-hiking",

        Cab: "fa-taxi",

        Travel: "fa-earth-asia"

    };


    return (
        icons[normalised] ||
        "fa-earth-asia"
    );

}


/* =========================================================
   STATUS CLASS
========================================================= */

function traveloraStatusClass(status) {

    if (status === "Cancelled") {

        return "status-cancelled";

    }


    if (status === "Completed") {

        return "status-completed";

    }


    if (status === "Travel Today") {

        return "status-today";

    }


    return "";

}

/* =========================================================
   SAFE TEXT FOR HTML
========================================================= */

function traveloraEscapeHTML(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        character => {

            const entities = {

                "&": "&amp;",

                "<": "&lt;",

                ">": "&gt;",

                '"': "&quot;",

                "'": "&#39;"

            };


            return entities[character];

        }
    );

}


/* =========================================================
   BOOKING REFERENCE
========================================================= */

function traveloraReference(trip) {

    const id =
        traveloraGetBookingId(trip);


    if (!id) {

        return "TR-PENDING";

    }


    return id.startsWith("TR-")
        ? id
        : "TR-" + id;

}


/* =========================================================
   PAYMENT STATUS
========================================================= */

function traveloraGetPaymentStatus(trip) {

    return (

        trip.paymentStatus ||
        trip.payment_status ||
        trip.payment?.status ||
        "Pending"

    );

}


/* =========================================================
   SUMMARY
========================================================= */

function traveloraUpdateSummary(trips) {

    let upcoming = 0;

    let completed = 0;

    let totalValue = 0;


    trips.forEach(trip => {

        const status =
            traveloraTripStatus(trip);


        if (

            status === "Confirmed" ||

            status === "Travel Today"

        ) {

            upcoming++;

        }


        if (status === "Completed") {

            completed++;

        }


        if (status !== "Cancelled") {

            totalValue +=
                traveloraGetPrice(trip);

        }

    });


    document.getElementById(
        "totalTrips"
    ).textContent = trips.length;


    document.getElementById(
        "upcomingTrips"
    ).textContent = upcoming;


    document.getElementById(
        "completedTrips"
    ).textContent = completed;


    document.getElementById(
        "totalSpent"
    ).textContent = traveloraFormatPrice(
        totalValue
    );

}


/* =========================================================
   BUILD A BOOKING CARD
========================================================= */

function traveloraCreateTripCard(trip) {

    const status =
        traveloraTripStatus(trip);


    const destination =
        traveloraGetDestination(trip);


    const service =
        traveloraNormaliseService(
            traveloraGetService(trip)
        );


    const date =
        traveloraFormatDate(
            traveloraGetTravelDate(trip)
        );


    const travellers =
        traveloraGetTravellerCount(trip);


    const price =
        traveloraFormatPrice(
            traveloraGetPrice(trip)
        );


    const image =
        traveloraDestinationImage(destination);


    const id =
        traveloraGetBookingId(trip);


    const paymentStatus =
        traveloraGetPaymentStatus(trip);


    let actionHTML = "";


    /* CANCELLATION BUTTON */

    if (traveloraCanCancel(trip)) {

        actionHTML = `

            <button

                type="button"

                class="trip-btn cancel-btn"

                data-action="cancel"

                data-id="${traveloraEscapeHTML(id)}">

                <i class="fa-solid fa-xmark"></i>

                Cancel Booking

            </button>

        `;

    }


    /* COMPLETED TRIP BUTTON */

    else if (status === "Completed") {

        actionHTML = `

            <button

                type="button"

                class="trip-btn delete-btn"

                data-action="delete"

                data-id="${traveloraEscapeHTML(id)}">

                <i class="fa-solid fa-trash"></i>

                Delete Trip

            </button>

        `;

    }


    /* CANCELLED BOOKING */

    else if (status === "Cancelled") {

        actionHTML = `

            <span class="trip-btn disabled-btn">

                <i class="fa-solid fa-ban"></i>

                Cancelled

            </span>

        `;

    }


    /* OTHER BOOKINGS */

    else {

        actionHTML = `

            <span class="trip-btn disabled-btn">

                <i class="fa-solid fa-clock"></i>

                Cancellation Closed

            </span>

        `;

    }


    /* NOTICES */

    let notice = "";


    if (status === "Cancelled") {

        notice = `

            <div class="trip-notice">

                <i class="fa-solid fa-circle-info"></i>

                This booking has been cancelled.
                Contact Travelora support for cancellation or refund information.

            </div>

        `;

    }


    else if (status === "Completed") {

        notice = `

            <div class="trip-notice">

                <i class="fa-solid fa-circle-check"></i>

                This trip is completed.
                You can remove it from your trip history.

            </div>

        `;

    }


    else if (status === "Travel Today") {

        notice = `

            <div class="trip-notice">

                <i class="fa-solid fa-bell"></i>

                Your travel date is today.
                Please check your service provider's instructions.

            </div>

        `;

    }


    else {

                <div class="trip-detail">

                    <i class="fa-solid fa-users"></i>

                    <div>

                        <span>Travellers</span>

                <div class="trip-detail">

                    <i class="fa-solid ${traveloraServiceIcon(service)}"></i>

                    <div>

/* =========================================================
   EMPTY STATE
========================================================= */

function traveloraShowEmpty(message, showBookButton) {

    const container =
        document.getElementById("tripItems");


    container.innerHTML = "";


    const empty =
        document.createElement("div");


    empty.className = "empty-state";


    empty.innerHTML = `

        <div class="empty-icon">

            <i class="fa-solid fa-suitcase-rolling"></i>

        </div>


        <h3>

            ${traveloraEscapeHTML(message)}

        </h3>


        <p>

            ${

                showBookButton

                ? "Your travel story starts here. Explore destinations and book your next adventure with Travelora."

                : "Try changing your search or filter to find your bookings."

            }

        </p>


        ${

            showBookButton

            ? `

                <a href="destinations.html" class="book-new-btn">

                    <i class="fa-solid fa-compass"></i>

                    Explore Destinations

                </a>

            `

            : ""

        }

}


/* =========================================================
   LOAD AND FILTER BOOKINGS
========================================================= */

function traveloraLoadTrips() {

    const container =
        document.getElementById("tripItems");


    if (!container) {

        return;

    }


    /* CHECK USER SESSION */

    if (
        localStorage.getItem("isLoggedIn") !== "true"
    ) {

        return;

    }


    /* GET ONLY CURRENT USER'S BOOKINGS */

    const trips =
        traveloraGetCurrentUsersTrips();


    /* UPDATE SUMMARY */

    traveloraUpdateSummary(trips);


    /* GET SEARCH VALUE */

    const searchInput =
        document.getElementById("tripSearch");


    const statusInput =
        document.getElementById("tripStatusFilter");


    const serviceInput =
        document.getElementById("tripServiceFilter");


    const search = searchInput
        ? searchInput.value.trim().toLowerCase()
        : "";


    const statusFilter = statusInput
        ? statusInput.value
        : "All";


    const serviceFilter = serviceInput
        ? serviceInput.value
        : "All";


    /* FILTER TRIPS */

    const matchingTrips =
        trips.filter(trip => {


            const status =
                traveloraTripStatus(trip);


            const service =
                traveloraNormaliseService(
                    traveloraGetService(trip)
                );


            const destination =
                traveloraGetDestination(trip);


            const searchText = (

                String(destination) + " " +

                service + " " +

                traveloraReference(trip) + " " +

                traveloraGetBookingId(trip)

            ).toLowerCase();


            const matchesSearch =
                searchText.includes(search);


            const matchesStatus =

                statusFilter === "All" ||

                status === statusFilter;


            const matchesService =

                serviceFilter === "All" ||

                service === serviceFilter;


            return (

                matchesSearch &&

                matchesStatus &&

                matchesService

            );

        });


    /* CLEAR OLD CARDS */

    container.innerHTML = "";


    /* NO BOOKINGS */

    if (trips.length === 0) {

        traveloraShowEmpty(
            "No bookings yet!",
            true
        );

        return;

    }


    /* NO FILTER MATCH */

    if (matchingTrips.length === 0) {

        traveloraShowEmpty(
            "No matching trips found",
            false
        );

        return;

    }


    /* DISPLAY CARDS */

    matchingTrips.forEach(trip => {

        container.appendChild(

            traveloraCreateTripCard(trip)

        );

    });

}


/* =========================================================
   UPDATE BOTH TRIP AND MASTER BOOKING RECORDS

   This keeps the admin dashboard booking status updated.
========================================================= */

function traveloraUpdateBookingStatus(id, newStatus) {

    const trips =
        traveloraGetTrips();


    const bookings =
        traveloraGetMasterBookings();


    let tripUpdated = false;

    let bookingUpdated = false;


    /* UPDATE TRIPS */

    trips.forEach(trip => {

        if (
            traveloraGetBookingId(trip) === String(id)
        ) {

            trip.status = newStatus;

            trip.updatedAt =
                new Date().toISOString();


            if (newStatus === "Cancelled") {

                trip.cancelledAt =
                    new Date().toISOString();

            }


            tripUpdated = true;

        }

    });


    /* UPDATE MASTER BOOKINGS */

    bookings.forEach(booking => {

        if (
            traveloraGetBookingId(booking) === String(id)
        ) {

            booking.status = newStatus;

            booking.updatedAt =
                new Date().toISOString();


            if (newStatus === "Cancelled") {

                booking.cancelledAt =
                    new Date().toISOString();

            }


            bookingUpdated = true;

        }

    });


    try {

        if (tripUpdated) {

            traveloraSaveTrips(trips);

        }


        if (bookingUpdated) {

            traveloraSaveMasterBookings(bookings);

        }


        return (
            tripUpdated ||
            bookingUpdated
        );

    } catch (error) {

        console.error(
            "Unable to update booking:",
            error
        );

        return false;

    }

}


/* =========================================================
   CANCEL BOOKING
========================================================= */

function traveloraCancelTrip(id) {

    const trips =
        traveloraGetCurrentUsersTrips();


    const trip = trips.find(item => {

        return (
            traveloraGetBookingId(item) === String(id)
        );

    });


    if (!trip) {

        alert("Booking not found.");

        return;

    }


    /* VERIFY OWNERSHIP AGAIN */

    const bookings =
        traveloraGetMasterBookings();


    if (
        !traveloraBelongsToCurrentUser(
            trip,
            bookings
        )
    ) {

        alert(
            "You are not authorised to cancel this booking."
        );

        return;

    }


    /* CHECK CANCELLATION RULE */

    if (!traveloraCanCancel(trip)) {

        alert(
            "This trip can no longer be cancelled."
        );

        return;

    }


    /* CONFIRMATION */

    const confirmed = confirm(

        "Are you sure you want to cancel your booking for " +

        traveloraGetDestination(trip) +

        "?"

    );


    if (!confirmed) {

        return;

    }


    /* UPDATE BOTH ARRAYS */

    const updated =
        traveloraUpdateBookingStatus(
            id,
            "Cancelled"
        );


    if (!updated) {

        alert(
            "Unable to update this booking. Please try again."
        );

        return;

    }


    /* REFRESH PAGE DATA */

    traveloraLoadTrips();


    alert(
        "Your booking has been cancelled successfully."
    );

}


/* =========================================================
   DELETE COMPLETED TRIP

   This removes the trip from the user's trip history.
   It does NOT delete the original master booking.
   Admin booking history remains available.
========================================================= */

function traveloraDeleteCompletedTrip(id) {

    const trips =
        traveloraGetTrips();


    const bookings =
        traveloraGetMasterBookings();


    const trip = trips.find(item => {

        return (
            traveloraGetBookingId(item) === String(id)
        );

    });


    if (!trip) {

        alert("Booking not found.");

        return;

    }


    /* VERIFY OWNERSHIP */

    if (
        !traveloraBelongsToCurrentUser(
            trip,
            bookings
        )
    ) {

        alert(
            "You are not authorised to delete this trip."
        );

        return;

    }


    /* ONLY COMPLETED TRIPS CAN BE DELETED */

    if (
        traveloraTripStatus(trip) !== "Completed"
    ) {

        alert(
            "Only completed trips can be deleted."
        );

        return;

    }


    /* CONFIRM DELETION */

    const confirmed = confirm(

        "Delete this completed trip from your trip history?"

    );


    if (!confirmed) {

        return;

    }


    /* REMOVE ONLY FROM TRIP HISTORY */

    const remaining = trips.filter(item => {

        return (
            traveloraGetBookingId(item) !== String(id)
        );

    });


    try {

        traveloraSaveTrips(remaining);


        traveloraLoadTrips();


        alert(
            "Completed trip deleted from your trip history."
        );


    } catch (error) {

        console.error(
            "Unable to delete completed trip:",
            error
        );


        alert(
            "Unable to delete this trip. Please try again."
        );

    }

}


/* =========================================================
   HANDLE CARD BUTTONS
========================================================= */

const traveloraTripContainer =
    document.getElementById("tripItems");


if (traveloraTripContainer) {

    traveloraTripContainer.addEventListener(
        "click",
        function(event) {


            const button =
                event.target.closest(
                    "button[data-action]"
                );


            if (!button) {

                return;

            }


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            if (action === "cancel") {

                traveloraCancelTrip(id);

            }


            else if (action === "delete") {

                traveloraDeleteCompletedTrip(id);

            }

        }
    );

}

========================================================= */

        return;

    traveloraLoadTrips();
